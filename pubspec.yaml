name: musicbyteai
description: "MusicByte is your essential offline companion for mastering music theory and engineering, offering a sleek, dark-themed toolkit for every musician and audio professional."
publish_to: "none"
# IMPORTANT: Google Play updates require an ever-increasing build number (the "+N" part).
# Dreamflow Publish will package this into Android's versionCode and iOS' CFBundleVersion.
version: 1.0.4+191

environment:
  sdk: ^3.6.0

dependencies:
  url_launcher: ^6.0.0
  permission_handler: ^12.0.0
  audioplayers: ^6.0.0
  shared_preferences: ^2.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  fl_chart: ^0.68.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  # NOTE: Ideally this should be a square, high-res app icon (e.g. 1024x1024 PNG).
  # Using the MusicByte logo here removes Dreamflow branding from launcher icons.
  image_path: assets/images/MBLogo.png
  remove_alpha_ios: true
